<div class="grid min-h-dvh lg:grid-cols-[1.1fr_1fr]">
  <aside
    class="relative hidden overflow-hidden border-r border-line bg-inset lg:flex lg:flex-col lg:justify-between lg:p-4"
  >
    <div class="flex items-center gap-1.5">
      <nc-logo [size]="40" />
      <div>
        <p class="font-ui text-title text-ink">Naucto</p>
        <p class="label">Admin console</p>
      </div>
    </div>
    <div
      class="pointer-events-none absolute -right-24 -bottom-24 size-[420px] rounded-full bg-[radial-gradient(circle,var(--nc-gold),transparent_70%)] opacity-[0.07]"
    ></div>
  </aside>

  <main class="flex items-center justify-center p-2">
    <div class="w-full max-w-[380px]">
      <div class="mb-3 flex items-center gap-1.5 lg:hidden">
        <nc-logo [size]="32" />
        <p class="font-ui text-title text-ink">Naucto admin</p>
      </div>

      @if (expired()) {
        <p class="mb-2 rounded-sm border border-line bg-raised px-1.5 py-1 text-body text-ink-body">
          Your session ended. Sign in again to carry on.
        </p>
      }

      <h1 class="font-ui text-display text-ink">Sign in</h1>
      <p class="mt-0.75 text-body text-ink-3">With your Naucto admin account.</p>
      <form
        #form
        class="mt-3 flex flex-col gap-1.5"
        (submit)="$event.preventDefault(); submit(form)"
      >
        <label class="flex flex-col gap-0.5">
          <span class="label">Email</span>
          <input class="nc-input" type="email" name="email" autocomplete="username" required />
        </label>
        <label class="flex flex-col gap-0.5">
          <span class="label">Password</span>
          <input
            class="nc-input"
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>
        @if (error(); as message) {
          <p class="text-body text-hot-ink" role="alert">{{ message }}</p>
        }
        <button type="submit" class="nc-button nc-button-primary mt-1 h-[38px]" [disabled]="busy()">
          {{ busy() ? 'Checking…' : 'Sign in' }}
        </button>
      </form>
    </div>
  </main>
</div>
